# The dashboards are files in this repository, loaded when Grafana starts and checked again every minute. Changes made
# in Grafana's editor can't be saved over them: change the file instead, so the repository stays the one source.
apiVersion: 1

providers:
  - name: Companion
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/companion
